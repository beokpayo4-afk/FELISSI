# Render Blueprint — documents required env vars. Do not put real secrets here.
# https://render.com/docs/blueprint-spec
#
# Uploaded images are stored on the service filesystem under uploads/.
# Free/ephemeral disks lose files on redeploy — attach a persistent disk to
# /opt/render/project/src/backend/uploads (or set UPLOADS_ROOT) for durability.

services:
  - type: web
    name: felissi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn main:app -c gunicorn.conf.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: API_PUBLIC_ORIGIN
        value: https://felissi-1.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: felissi-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: felissi-db
    plan: free
