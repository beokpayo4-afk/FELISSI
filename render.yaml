# Render Blueprint — documents required env vars. Do not put real secrets here.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: felissi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn main:app -c gunicorn.conf.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: API_PUBLIC_ORIGIN
        value: https://felissi-1.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: felissi-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_BUCKET_NAME
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto

databases:
  - name: felissi-db
    plan: free
