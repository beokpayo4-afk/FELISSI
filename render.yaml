# Render Blueprint — documents required env vars. Do not put real secrets here.
# https://render.com/docs/blueprint-spec
#
# Root Directory on Render must be: backend
#
# Uploaded images live under uploads/ and are served at /uploads/.
# Render's default disk is ephemeral — files are lost on redeploy unless you
# attach a persistent disk mounted at the uploads directory.
#
# This service uses Neon PostgreSQL. Set DATABASE_URL manually in the dashboard
# (do not leave it empty). Object storage (R2/S3/MinIO) is not used.

services:
  - type: web
    name: felissi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn main:app -c gunicorn.conf.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: API_PUBLIC_ORIGIN
        value: https://felissi-1.onrender.com
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # Required — paste Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: UPLOAD_STORAGE_BACKEND
        value: ""
