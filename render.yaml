# Render Blueprint — documents required env vars. Do not put real secrets here.
# https://render.com/docs/blueprint-spec
#
# Root Directory on Render must be: backend
#
# Uploaded images live under uploads/ and are served at /uploads/.
# Render's default disk is ephemeral — files are lost on redeploy unless you
# attach a persistent disk mounted at the uploads directory.
#
# IMPORTANT — do not put the gunicorn start command in Build Command.
# Build installs deps; Start runs the server. Mixing them causes:
#   bash: gunicorn: command not found
#
# Build:  pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
# Start:  gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT

services:
  - type: web
    name: felissi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Do not use generateValue here — Render mints ~44 chars; Django W009 needs >=50.
      # Paste output of: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: felissi-1.onrender.com
      - key: API_PUBLIC_ORIGIN
        value: https://felissi-1.onrender.com
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # Required — paste Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: UPLOAD_STORAGE_BACKEND
        value: ""
