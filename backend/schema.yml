        line1:
          type: string
          maxLength: 160
        line2:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          pattern: ^\d{6}$
          maxLength: 6
        country:
          type: string
          maxLength: 64
        is_default:
          type: boolean
      required:
      - city
      - full_name
      - id
      - line1
      - phone
      - pincode
      - state
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
