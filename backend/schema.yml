          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        subtotal:
          type: string
          readOnly: true
        discount:
          type: string
          readOnly: true
        gst:
          type: string
          readOnly: true
        gst_inclusive:
          type: boolean
          readOnly: true
        taxable_subtotal:
          type: string
          readOnly: true
        shipping_charge:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        coupon_code:
          type: string
          nullable: true
          readOnly: true
        coupon_error:
          type: string
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
